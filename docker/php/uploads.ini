; Limites de upload do Lumina ERP.
; O padrão da imagem php:8.4-fpm (upload_max_filesize = 2M) recusava arquivos
; maiores que 2 MB antes de chegarem ao Livewire. Os formulários aceitam até
; 10 MB (documentos de matrícula) e o upload temporário do Livewire até 12 MB.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
